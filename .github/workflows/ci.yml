name: CI

on:
  pull_request:
  push:
    branches: [main]

# A deploy that fails only after merging is the thing this is here to stop:
# on 2026-08-28 two merged PRs carried a package-lock.json generated by a
# partial `npm install` that pruned every platform's optional native binaries,
# so Cloudflare's `npm clean-install` refused and the deploy never ran.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Cloudflare build environment (nodejs@24).
          node-version: 24
          cache: npm

      # Exactly what Cloudflare runs. Fails when package-lock.json and
      # package.json disagree, which is the failure mode above.
      - name: Install (same command as the Cloudflare build)
        run: npm clean-install --progress=false

      - name: Typecheck
        run: npm run check

      # Includes the debug/rules.json corpus test, so an upstream calendar
      # format the parser does not understand fails here instead of silently
      # degrading days to "I don't understand these rules yet" in production.
      - name: Test
        run: npm test

      - name: Format
        run: npm run format:check

      # Type-checking does not prove the worker bundles for workerd.
      - name: Build
        run: npx wrangler deploy --dry-run --outdir=dist
        env:
          WRANGLER_SEND_METRICS: false
